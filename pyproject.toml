[project]
name = "cross-lingual-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "emilhgvandermeer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "numpy==1.26.0",
    "pandas>=2.3.3",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
cross-lingual-llm = "cross_lingual_llm:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
